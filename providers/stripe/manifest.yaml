# Stripe — Vault-Payments provider manifest
#
# Phase 1 walking skeleton. Capability statuses mirror the committed research in
# docs/PROVIDER_MATRIX.md §4.1. Nothing here is sandbox-proven yet: these are
# documentation-level findings, and a provider only becomes *supported* when
# G1–G7 in docs/MVP_PLAN.md §1 pass.

id: stripe
display_name: Stripe
strategy: native
surface: default
oracle_connector: stripe

regions: [US, CA, GB, EU, AU, JP, SG, BR, IN, MX, NZ, CH, SE, NO, DK, PL, CZ, AT, BE, DE, ES, FR, IE, IT, NL, PT, FI, LU, MY, TH, HK, AE]

summary: >-
  Payment Intents lifecycle with header bearer auth, an Idempotency-Key header,
  and a signature over timestamp + raw body. The simplest correct baseline.

endpoints:
  # Stripe uses one host for both modes; the key prefix selects test vs live.
  live: https://api.stripe.com
  sandbox: https://api.stripe.com

request:
  # Stripe accepts application/x-www-form-urlencoded, not JSON. Nested values
  # use bracket notation (e.g. metadata[order_id]=…).
  encoding: form

auth:
  model: bearer
  oauth_required_for_seller_context: false
  header: Authorization
  credential_fields:
    - name: secret_key
      required: true
      secret: true
      env: STRIPE_SECRET_KEY
      description: Secret API key. `sk_test_…` in sandbox, `sk_live_…` in production.
    - name: webhook_secret
      required: true
      secret: true
      env: STRIPE_WEBHOOK_SECRET
      description: Endpoint signing secret (`whsec_…`) used to verify inbound webhooks.
    - name: publishable_key
      required: true
      secret: false
      env: STRIPE_PUBLISHABLE_KEY
      description: Publishable key (`pk_test_…`) for the browser tokenization component. Not a secret.

capabilities:
  payment.create:
    status: verified
    source: https://docs.stripe.com/api/payment_intents/create
  payment.authorize:
    status: verified
    notes: >-
      Create+confirm in one call: a PaymentIntent with confirm=true, a
      frontend-minted payment_method, a return_url for the redirectable-method
      confirmation contract, card-only payment_method_types and
      capture_method=manual. Without confirmation the intent never reaches
      requires_capture, so capture is refused. Verified live in the partner
      sandbox with a restricted key.
    source: https://docs.stripe.com/api/payment_intents/create
  payment.capture:
    status: verified
    source: https://docs.stripe.com/api/payment_intents/capture
  payment.void:
    status: verified
    notes: Cancelling an uncaptured PaymentIntent is the void path.
    source: https://docs.stripe.com/api/payment_intents/cancel
  payment.refund:
    status: verified
    notes: Full and partial refunds; refunds are created against a PaymentIntent or Charge.
    source: https://docs.stripe.com/api/refunds/create
  payment.status:
    status: verified
    source: https://docs.stripe.com/api/payment_intents/retrieve
  idempotency:
    status: verified
    notes: Idempotency-Key header, retained for 24 hours on v1 endpoints.
    source: https://docs.stripe.com/api/idempotent_requests

operations:
  authorize:
    capability: payment.authorize
    method: POST
    path: /v1/payment_intents
    idempotency: header
    idempotency_field: Idempotency-Key
    body:
      amount: { from: amount }
      currency: { from: currency }
      # A Stripe authorization is create+confirm in a single call: without
      # confirmation the intent only reaches requires_payment_method, and the
      # provider refuses to capture an unconfirmed intent.
      confirm: { const: true }
      payment_method: { from: payment_method }
      # Card-only. With automatic payment methods (the newer-account default)
      # a confirmation accepts dashboard-enabled redirect methods, which the
      # provider then refuses server-side without a return_url.
      payment_method_types[0]: { const: card }
      # The provider requires a post-payment completion URL at confirmation;
      # its automated sandbox monitor also rejects confirmations without one.
      return_url: { from: return_url }
      capture_method: { const: manual }
      description: { from: reference }
      metadata: { from: metadata }
    # Provider-documented test token: Stripe's sandbox accepts this constant to
    # mint a real PaymentMethod without a browser session. Test-mode only.
    sandbox_token: pm_card_visa
  capture:
    capability: payment.capture
    method: POST
    path: /v1/payment_intents/{id}/capture
    idempotency: header
    idempotency_field: Idempotency-Key
    body:
      amount_to_capture: { from: amount }
  void:
    capability: payment.void
    method: POST
    path: /v1/payment_intents/{id}/cancel
    idempotency: header
    idempotency_field: Idempotency-Key
  refund:
    capability: payment.refund
    method: POST
    path: /v1/refunds
    idempotency: header
    idempotency_field: Idempotency-Key
    body:
      payment_intent: { from: id }
      amount: { from: amount }
  status:
    capability: payment.status
    method: GET
    path: /v1/payment_intents/{id}
    idempotency: none

terminals:
  physical_terminal: verified
  tap_to_pay_mobile: verified
  notes: >-
    Terminal support does not follow processor support. Stripe Terminal is a
    separate SDK family with its own enablement and is out of scope for the MVP.

webhooks:
  registration: dashboard
  verification: hmac_local
  notification_url_binding: false
  signature:
    header: Stripe-Signature
    algorithm: hmac-sha256
    encoding: hex
    signed_payload: "{timestamp}.{raw_body}"
    header_format:
      type: key_value_pairs
      timestamp_key: t
      signature_key: v1
    tolerance_seconds: 300
    # References auth.credential_fields[].name above.
    secret: webhook_secret
  event_id_field: id
  event_type_field: type
  retry_window: "72h"
  replay_protection: manual
  notes: >-
    Header carries `t=<timestamp>,v1=<signature>`. There is no automatic replay:
    use the events list or a dashboard resend, and dedupe on the event id.
  source: https://docs.stripe.com/webhooks

tokenization:
  # Hosted fields: card data is entered into provider-hosted inputs and never
  # reaches this server. The script is loaded from the provider's own CDN and
  # is never bundled or copied.
  kind: hosted_fields
  script_url: https://js.stripe.com/v3/
  global_name: Stripe
  publishable_key: publishable_key
  mount:
    card: "#card-element"
  submit_target: "#payment-form"
  route: /payments/authorize

sandbox:
  access: self_serve
  notes: Instant test-mode keys; no partner approval required.

approval:
  partner_program: false
  app_review: false

attribution:
  required_fields: []
  notes: Stripe requires no application-identification fields on API requests.

distribution:
  # Vault-Payments never copies a provider SDK into generated output.
  vendor_sdk: prohibited

sources:
  - https://docs.stripe.com/api
  - https://docs.stripe.com/webhooks
  - https://docs.stripe.com/api/idempotent_requests
  - https://docs.stripe.com/terminal
  - https://docs.stripe.com/testing

verified_at: 2026-10-21
